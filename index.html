/* ---------------------------------------------------------------
   Biểu đồ cột (tự vẽ SVG, không phụ thuộc recharts)
--------------------------------------------------------------- */
function SimpleBarChart({ data, series, height = 260, colorForBar }) {
  const chartH = height - 34;
  const barGroupW = 64;
  const width = Math.max(320, data.length * barGroupW);
  const max = Math.max(1, ...data.flatMap((d) => series.map((s) => Number(d[s.key]) || 0)));
  const barW = Math.min(26, (barGroupW - 12) / series.length);
  return (
    <div>
      <div style={{ overflowX: "auto" }}>
        <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
          {[0, 0.25, 0.5, 0.75, 1].map((f, i) => (
            <line key={i} x1="0" x2={width} y1={chartH * (1 - f)} y2={chartH * (1 - f)} stroke={TOKENS.border} strokeWidth="1" />
          ))}
          {data.map((d, gi) => (
            <g key={gi} transform={`translate(${gi * barGroupW + 6},0)`}>
              {series.map((s, si) => {
                const val = Number(d[s.key]) || 0;
                const h = (val / max) * chartH;
                const color = colorForBar ? colorForBar(d, s) : s.color;
                return <rect key={si} x={si * (barW + 3)} y={chartH - h} width={barW} height={Math.max(0, h)} rx="3" fill={color} />;
              })}
              <text x={(barGroupW - 12) / 2} y={height - 12} textAnchor="middle" fontSize="11" fill={TOKENS.textSecondary}>{d.name}</text>
            </g>
          ))}
        </svg>
      </div>
      {series.length > 1 && (
        <div className="flex flex-wrap gap-3 mt-2">
          {series.map((s, i) => (
            <div key={i} className="flex items-center gap-1.5 text-xs" style={{ color: TOKENS.textSecondary }}>
              <span style={{ width: 10, height: 10, borderRadius: 2, background: s.color, display: "inline-block" }} />{s.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function round1(n) { return Math.round(n * 10) / 10; }

function summarizeStudent(cls, studentId, attendance, grades) {
  let present = 0, excused = 0, absent = 0, late = 0, totalDays = 0;
  Object.entries(attendance).forEach(([key, rec]) => {
    if (!key.endsWith(`_${cls}`)) return;
    totalDays++;
    const st = rec[studentId] || "present";
    if (st === "present") present++;
    else if (st === "excused") excused++;
    else if (st === "absent") absent++;
    else if (st === "late") late++;
  });
  const clsGrades = grades[cls] || { assessments: [], scores: {} };
  const bySubject = {};
  const allValid = [];
  clsGrades.assessments.forEach((a) => {
    const raw = clsGrades.scores[a.id]?.[studentId];
    if (raw === undefined || raw === "" || isNaN(Number(raw))) return;
    const val = Number(raw);
    allValid.push(val);
    bySubject[a.subject] = bySubject[a.subject] || { sum: 0, count: 0 };
    bySubject[a.subject].sum += val;
    bySubject[a.subject].count++;
  });
  const subjectAverages = Object.fromEntries(
    Object.entries(bySubject).map(([subj, v]) => [subj, round1(v.sum / v.count)])
  );
  const overallAvg = allValid.length ? round1(allValid.reduce((a, b) => a + b, 0) / allValid.length) : null;
  return { present, excused, absent, late, totalDays, subjectAverages, overallAvg };
}

/* ---------------- Anthropic API (cho AI Nhận xét, cần API key riêng) ---------------- */
async function callClaudeDirect(promptText, apiKey) {
  if (!apiKey) throw new Error("NO_API_KEY");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1200,
      messages: [{ role: "user", content: promptText }],
    }),
  });
  if (!res.ok) {
    const t = await res.text().catch(() => "");
    throw new Error(`API lỗi ${res.status}: ${t.slice(0, 200)}`);
  }
  return res.json();
}
function extractText(data) {
  if (!data || !Array.isArray(data.content)) return "";
  return data.content.filter((b) => b.type === "text").map((b) => b.text).join("\n").trim();
}

/* ---------------- Google Drive (OAuth thật qua Google Identity Services) ---------------- */
let tokenClient = null;
let cachedAccessToken = null;
let cachedTokenExpiry = 0;

function ensureTokenClient(clientId, onToken) {
  if (!window.google || !window.google.accounts) return null;
  if (!tokenClient || tokenClient.__clientId !== clientId) {
    tokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: DRIVE_SCOPE,
      callback: (resp) => {
        if (resp && resp.access_token) {
          cachedAccessToken = resp.access_token;
          cachedTokenExpiry = Date.now() + (Number(resp.expires_in || 3600) - 60) * 1000;
        }
        onToken(resp);
      },
    });
    tokenClient.__clientId = clientId;
  }
  return tokenClient;
}

function requestAccessToken(clientId, { silent } = {}) {
  return new Promise((resolve, reject) => {
    if (!clientId) return reject(new Error("NO_CLIENT_ID"));
    const client = ensureTokenClient(clientId, (resp) => {
      if (resp && resp.access_token) resolve(resp.access_token);
      else reject(new Error(resp?.error || "AUTH_FAILED"));
    });
    if (!client) return reject(new Error("GIS_NOT_LOADED"));
    if (cachedAccessToken && Date.now() < cachedTokenExpiry) return resolve(cachedAccessToken);
    client.requestAccessToken({ prompt: silent ? "none" : "" });
  });
}

async function driveFindFile(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error(`DRIVE_SEARCH_${res.status}`);
  const data = await res.json();
  return data.files && data.files[0] ? data.files[0].id : null;
}

async function driveCreateFile(token, payload) {
  const boundary = "dd_thcs_boundary_" + Date.now();
  const metadata = { name: DRIVE_FILE_NAME, mimeType: "application/json" };
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(payload)}\r\n` +
    `--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error(`DRIVE_CREATE_${res.status}`);
  const data = await res.json();
  return data.id;
}

async function driveUpdateFile(token, fileId, payload) {
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error(`DRIVE_UPDATE_${res.status}`);
}

async function driveReadFile(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error(`DRIVE_READ_${res.status}`);
  return res.json();
}

  const isFirstRun = useRef(true);
  const syncTimer = useRef(null);
  const pollTimer = useRef(null);
  const fileIdRef = useRef(lsGet(LS_KEYS.fileId) || null);

  /* ---- tải dữ liệu local khi khởi động ---- */
  useEffect(() => {
    const raw = lsGet(LS_KEYS.data);
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed.students) setStudents(parsed.students);
        if (parsed.attendance) setAttendance(parsed.attendance);
        if (parsed.grades) setGrades(parsed.grades);
        if (parsed.groups) setGroups(parsed.groups);
        if (parsed.groupCounts) setGroupCounts(parsed.groupCounts);
        if (parsed.comments) setComments(parsed.comments);
      } catch {}
    }
    setLoaded(true);
    // nếu đã có Client ID lưu sẵn, thử đăng nhập âm thầm (không hiện popup) khi trang mở lại
    if (googleClientId) {
      requestAccessToken(googleClientId, { silent: true })
        .then(() => { setDriveConnected(true); setSyncStatus("idle"); })
        .catch(() => setSyncStatus("offline"));
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* ---- lưu local mỗi khi dữ liệu đổi ---- */
  useEffect(() => {
    if (!loaded) return;
    lsSet(LS_KEYS.data, JSON.stringify({ students, attendance, grades, groups, groupCounts, comments }));
  }, [students, attendance, grades, groups, groupCounts, comments, loaded]);

  /* ---- tự động đồng bộ Drive (debounce) ---- */
  useEffect(() => {
    if (!loaded) return;
    if (isFirstRun.current) { isFirstRun.current = false; return; }
    if (!autoSync || !driveConnected) return;
    clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(() => { pushToDrive(); }, 2500);
    return () => clearTimeout(syncTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [students, attendance, grades, groups, groupCounts, comments, loaded, autoSync, driveConnected]);

  /* ---- kiểm tra Drive định kỳ (mô phỏng gần-thời-gian-thực bằng polling) ---- */
  useEffect(() => {
    clearInterval(pollTimer.current);
    if (!driveConnected || !autoSync) return;
    pollTimer.current = setInterval(() => { pullFromDrive({ silent: true }); }, 45000);
    return () => clearInterval(pollTimer.current);
  }, [driveConnected, autoSync]);

  function saveGoogleClientId(id) {
    setGoogleClientId(id);
    lsSet(LS_KEYS.clientId, id);
  }
  function saveAnthropicKey(k) {
    setAnthropicKey(k);
    lsSet(LS_KEYS.apiKey, k);
  }

  async function connectDrive() {
    if (!googleClientId) return { ok: false, msg: "Chưa nhập Google Client ID." };
    setSyncStatus("syncing");
    try {
      await requestAccessToken(googleClientId, { silent: false });
      setDriveConnected(true);
      setSyncStatus("idle");
      return { ok: true };
    } catch (e) {
      setSyncStatus("offline");
      return { ok: false, msg: "Không đăng nhập được Google. Kiểm tra lại Client ID." };
    }
  }

  async function pushToDrive() {
    if (!driveConnected || !googleClientId) return { ok: false };
    setSyncStatus("syncing");
    try {
      const token = await requestAccessToken(googleClientId, { silent: true });
      const payload = { classes: ALL_CLASSES, students, attendance, grades, groups, groupCounts, comments, updatedAt: new Date().toISOString() };
      let fileId = fileIdRef.current;
      if (!fileId) fileId = await driveFindFile(token);
      if (!fileId) fileId = await driveCreateFile(token, payload);
      else await driveUpdateFile(token, fileId, payload);
      fileIdRef.current = fileId;
      lsSet(LS_KEYS.fileId, fileId);
      setSyncStatus("synced");
      setLastSync(Date.now());
      return { ok: true };
    } catch (e) {
      setSyncStatus("error");
      return { ok: false, msg: "Đồng bộ thất bại: " + e.message };
    }
  }

  async function pullFromDrive({ silent } = {}) {
    if (!driveConnected || !googleClientId) return { ok: false };
    if (!silent) setSyncStatus("syncing");
    try {
      const token = await requestAccessToken(googleClientId, { silent: true });
      let fileId = fileIdRef.current || (await driveFindFile(token));
      if (!fileId) {
        if (!silent) setSyncStatus("error");
        return { ok: false, msg: "Chưa có dữ liệu trên Drive." };
      }
      fileIdRef.current = fileId;
      lsSet(LS_KEYS.fileId, fileId);
      const parsed = await driveReadFile(token, fileId);
      if (parsed.students) setStudents(parsed.students);
      if (parsed.attendance) setAttendance(parsed.attendance);
      if (parsed.grades) setGrades(parsed.grades);
      if (parsed.groups) setGroups(parsed.groups);
      if (parsed.groupCounts) setGroupCounts(parsed.groupCounts);
      if (parsed.comments) setComments(parsed.comments);
      setSyncStatus("synced");
      setLastSync(Date.now());
      return { ok: true };
    } catch (e) {
      if (!silent) setSyncStatus("error");
      return { ok: false, msg: "Không tải được từ Drive." };
    }
  }

  /* ---- học sinh ---- */
  function addStudents(cls, names) {
    setStudents((prev) => {
      const list = prev[cls] ? [...prev[cls]] : [];
      names.map((n) => n.trim()).filter(Boolean).forEach((name) => list.push({ id: uid(), name }));
      return { ...prev, [cls]: list };
    });
  }
  function renameStudent(cls, id, name) {
    setStudents((prev) => ({ ...prev, [cls]: (prev[cls] || []).map((s) => (s.id === id ? { ...s, name } : s)) }));
  }
  function removeStudent(cls, id) {
    setStudents((prev) => ({ ...prev, [cls]: (prev[cls] || []).filter((s) => s.id !== id) }));
  }

  /* ---- điểm danh ---- */
  function setStatus(dateKey, cls, studentId, status) {
    const key = `${dateKey}_${cls}`;
    setAttendance((prev) => ({ ...prev, [key]: { ...(prev[key] || {}), [studentId]: status } }));
  }
  function markAllPresent(dateKey, cls) {
    const key = `${dateKey}_${cls}`;
    const list = students[cls] || [];
    const rec = {};
    list.forEach((s) => (rec[s.id] = "present"));
    setAttendance((prev) => ({ ...prev, [key]: rec }));
  }

  /* ---- điểm số ---- */
  function addAssessment(cls, subject, label, date) {
    const id = uid();
    setGrades((prev) => {
      const clsData = prev[cls] || { assessments: [], scores: {} };
      return { ...prev, [cls]: { assessments: [...clsData.assessments, { id, subject, label, date }], scores: { ...clsData.scores, [id]: {} } } };
    });
  }
  function removeAssessment(cls, assessmentId) {
    setGrades((prev) => {
      const clsData = prev[cls] || { assessments: [], scores: {} };
      const { [assessmentId]: _, ...restScores } = clsData.scores;
      return { ...prev, [cls]: { assessments: clsData.assessments.filter((a) => a.id !== assessmentId), scores: restScores } };
    });
  }
  function setScore(cls, assessmentId, studentId, value) {
    let clean = value;
    if (clean !== "") {
      const n = Number(clean);
      if (!isNaN(n)) clean = String(Math.max(0, Math.min(10, n)));
    }
    setGrades((prev) => {
      const clsData = prev[cls] || { assessments: [], scores: {} };
      return { ...prev, [cls]: { ...clsData, scores: { ...clsData.scores, [assessmentId]: { ...(clsData.scores[assessmentId] || {}), [studentId]: clean } } } };
    });
  }

  /* ---- tổ / thi đua ---- */
  function setGroupCount(cls, n) {
    setGroupCounts((prev) => ({ ...prev, [cls]: n }));
    setGroups((prev) => {
      const clsGroups = prev[cls];
      if (!clsGroups) return prev;
      let changed = false;
      const next = {};
      Object.entries(clsGroups).forEach(([studentId, g]) => {
        next[studentId] = g > n ? n : g;
        if (g > n) changed = true;
      });
      return changed ? { ...prev, [cls]: next } : prev;
    });
  }
  function setStudentGroup(cls, studentId, groupNumber) {
    setGroups((prev) => ({ ...prev, [cls]: { ...(prev[cls] || {}), [studentId]: groupNumber } }));
  }
  function autoDistribute(cls, n) {
    const list = students[cls] || [];
    const assignment = {};
    list.forEach((s, idx) => { assignment[s.id] = (idx % n) + 1; });
    setGroups((prev) => ({ ...prev, [cls]: assignment }));
  }

  /* ---- AI nhận xét ---- */
  function setCommentText(cls, studentId, text) {
    setComments((prev) => ({ ...prev, [cls]: { ...(prev[cls] || {}), [studentId]: { text, updatedAt: prev[cls]?.[studentId]?.updatedAt || Date.now() } } }));
  }

  async function generateClassComments(cls) {
    if (!anthropicKey) return { ok: false, msg: 'Chưa nhập Anthropic API Key ở mục Cài đặt.' };
    const list = students[cls] || [];
    if (list.length === 0) return { ok: false, msg: "Lớp chưa có học sinh." };
    const lines = list.map((s) => {
      const sum = summarizeStudent(cls, s.id, attendance, grades);
      const subjParts = Object.entries(sum.subjectAverages).map(([k, v]) => `${k}: ${v}`).join(", ") || "chưa có điểm";
      return `- ID ${s.id} | Tên: ${s.name} | ĐTB chung: ${sum.overallAvg ?? "chưa có điểm"} | Điểm theo môn: ${subjParts} | Chuyên cần: ${sum.present}/${sum.totalDays} buổi có mặt, vắng có phép ${sum.excused}, vắng không phép ${sum.absent}, đi muộn ${sum.late}`;
    }).join("\n");
    const prompt = `Bạn là giáo viên chủ nhiệm lớp ${cls} (THCS), viết nhận xét học tập & rèn luyện cho từng học sinh theo tinh thần Thông tư 22/2021: ngắn gọn 2-3 câu, khách quan, mang tính động viên, nêu điểm mạnh và một điều cần cố gắng, không so sánh giữa các học sinh, không dùng từ ngữ nặng nề.

Dữ liệu từng học sinh:
${lines}

Chỉ trả lời bằng đúng JSON theo định dạng sau, không thêm lời dẫn, không dùng dấu backtick markdown:
{"comments": {"<ID học sinh>": "<nội dung nhận xét>"}}`;
    try {
      const data = await callClaudeDirect(prompt, anthropicKey);
      const text = extractText(data).replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(text);
      const map = parsed.comments || {};
      setComments((prev) => {
        const clsComments = { ...(prev[cls] || {}) };
        Object.entries(map).forEach(([id, txt]) => { clsComments[id] = { text: String(txt).trim(), updatedAt: Date.now() }; });
        return { ...prev, [cls]: clsComments };
      });
      return { ok: true };
    } catch (e) {
      return { ok: false, msg: "Không tạo được nhận xét: " + e.message };
    }
  }

  async function generateOneComment(cls, studentId) {
    if (!anthropicKey) return { ok: false, msg: 'Chưa nhập Anthropic API Key ở mục Cài đặt.' };
    const list = students[cls] || [];
    const s = list.find((x) => x.id === studentId);
    if (!s) return { ok: false };
    const sum = summarizeStudent(cls, studentId, attendance, grades);
    const subjParts = Object.entries(sum.subjectAverages).map(([k, v]) => `${k}: ${v}`).join(", ") || "chưa có điểm";
    const prompt = `Bạn là giáo viên chủ nhiệm THCS. Viết nhận xét học tập & rèn luyện cho học sinh sau, theo tinh thần Thông tư 22/2021: ngắn gọn 2-3 câu, khách quan, mang tính động viên, nêu điểm mạnh và một điều cần cố gắng, không dùng từ ngữ nặng nề.

Học sinh: ${s.name} (lớp ${cls})
ĐTB chung: ${sum.overallAvg ?? "chưa có điểm"}
Điểm theo môn: ${subjParts}
Chuyên cần: ${sum.present}/${sum.totalDays} buổi có mặt, vắng có phép ${sum.excused}, vắng không phép ${sum.absent}, đi muộn ${sum.late}

Chỉ trả lời đúng nội dung nhận xét, không thêm lời dẫn, không dùng dấu ngoặc kép bao quanh toàn bộ câu trả lời.`;
    try {
      const data = await callClaudeDirect(prompt, anthropicKey);
      const text = extractText(data).trim();
      setComments((prev) => ({ ...prev, [cls]: { ...(prev[cls] || {}), [studentId]: { text, updatedAt: Date.now() } } }));
      return { ok: true };
    } catch (e) {
      return { ok: false, msg: e.message };
    }
  }

  const totalStudents = useMemo(() => Object.values(students).reduce((a, l) => a + l.length, 0), [students]);

  const TABS = [
    { id: "dashboard", label: "Tổng quan", icon: LayoutDashboard },
    { id: "students", label: "Học sinh", icon: Users },
    { id: "attendance", label: "Điểm danh", icon: CalendarCheck2 },
    { id: "aicomments", label: "AI Nhận xét", icon: Sparkles },
    { id: "grades", label: "Học tập", icon: BookOpen },
    { id: "competition", label: "Thi đua", icon: Trophy },
    { id: "settings", label: "Cài đặt", icon: Settings },
  ];

  return (
    <div className="flex flex-col md:flex-row min-h-screen w-full" style={{ background: TOKENS.bg, color: TOKENS.textPrimary, fontFamily: "'Be Vietnam Pro', system-ui, sans-serif" }}>
      <Sidebar tab={tab} setTab={setTab} totalStudents={totalStudents} tabs={TABS} />
      <main className="flex-1 min-w-0">
        <TopBar title={TABS.find((t) => t.id === tab)?.label || ""} syncStatus={syncStatus} lastSync={lastSync} />
        <div className="p-4 md:p-6">
          {!loaded ? (
            <div className="py-20 text-center" style={{ color: TOKENS.textSecondary }}>Đang tải dữ liệu…</div>
          ) : tab === "dashboard" ? (
            <Dashboard students={students} attendance={attendance} />
          ) : tab === "students" ? (
            <StudentsTab students={students} addStudents={addStudents} renameStudent={renameStudent} removeStudent={removeStudent} />
          ) : tab === "attendance" ? (
            <AttendanceTab students={students} attendance={attendance} setStatus={setStatus} markAllPresent={markAllPresent} onSaveNow={pushToDrive} />
          ) : tab === "aicomments" ? (
            <AiCommentsTab students={students} attendance={attendance} grades={grades} comments={comments}
              generateClassComments={generateClassComments} generateOneComment={generateOneComment} setCommentText={setCommentText} />
          ) : tab === "grades" ? (
            <GradesTab students={students} grades={grades} addAssessment={addAssessment} removeAssessment={removeAssessment} setScore={setScore} />
          ) : tab === "competition" ? (
            <CompetitionTab students={students} grades={grades} attendance={attendance} groups={groups} groupCounts={groupCounts}
              setGroupCount={setGroupCount} setStudentGroup={setStudentGroup} autoDistribute={autoDistribute} />
          ) : (
            <SettingsTab
              googleClientId={googleClientId} saveGoogleClientId={saveGoogleClientId}
              anthropicKey={anthropicKey} saveAnthropicKey={saveAnthropicKey}
              driveConnected={driveConnected} onConnectDrive={connectDrive}
              autoSync={autoSync} setAutoSync={setAutoSync}
              syncStatus={syncStatus} lastSync={lastSync}
              onSyncNow={pushToDrive} onPullNow={() => pullFromDrive({ silent: false })}
            />
          )}
        </div>
      </main>
    </div>
  );
}

/* ---------------------------------------------------------------
   Tab Tổng quan
--------------------------------------------------------------- */

function Dashboard({ students, attendance }) {
  const [date, setDate] = useState(todayStr());
  const rows = useMemo(() => ALL_CLASSES.map((cls) => {
    const list = students[cls] || [];
    const rec = attendance[`${date}_${cls}`] || {};
    let present = 0, excused = 0, absent = 0, late = 0;
    list.forEach((s) => {
      const st = rec[s.id] || "present";
      if (st === "present") present++; else if (st === "excused") excused++; else if (st === "absent") absent++; else if (st === "late") late++;
    });
    const total = list.length;
    const rate = total ? round1((present / total) * 100) : null;
    return { cls, total, present, excused, absent, late, rate };
  }), [students, attendance, date]);

  const totals = rows.reduce((acc, r) => ({
    total: acc.total + r.total, present: acc.present + r.present, excused: acc.excused + r.excused, absent: acc.absent + r.absent, late: acc.late + r.late,
  }), { total: 0, present: 0, excused: 0, absent: 0, late: 0 });

  const chartData = rows.filter((r) => r.total > 0).map((r) => ({ name: r.cls, rate: r.rate }));

  return (
    <div className="flex flex-col gap-6">
      <div className="flex flex-wrap items-center gap-3">
        <label className="text-sm font-medium" style={{ color: TOKENS.textSecondary }}>Xem theo ngày</label>
        <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="rounded-md px-3 py-1.5 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
      </div>
      <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
        <StatCard label="Sĩ số toàn khối" value={totals.total} color={TOKENS.navy} />
        <StatCard label="Có mặt" value={totals.present} color={TOKENS.present} />
        <StatCard label="Vắng có phép" value={totals.excused} color={TOKENS.excused} />
        <StatCard label="Vắng không phép" value={totals.absent} color={TOKENS.absent} />
        <StatCard label="Đi muộn" value={totals.late} color={TOKENS.late} />
      </div>
      <Card style={{ padding: "20px" }}>
        <div className="text-sm font-semibold mb-4">Tỷ lệ có mặt theo lớp (%)</div>
        {chartData.length === 0 ? <EmptyState text="Chưa có dữ liệu điểm danh cho ngày này." /> : (
          <SimpleBarChart
            data={chartData}
            series={[{ key: "rate", color: TOKENS.present, label: "Tỷ lệ có mặt" }]}
            colorForBar={(d) => (d.rate < 90 ? TOKENS.absent : TOKENS.present)}
          />
        )}
      </Card>
      <Card>
        <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>Chi tiết theo lớp</div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead><tr style={{ color: TOKENS.textSecondary }}>
              <th className="text-left font-medium px-5 py-2">Lớp</th>
              <th className="text-right font-medium px-3 py-2">Sĩ số</th>
              <th className="text-right font-medium px-3 py-2">Có mặt</th>
              <th className="text-right font-medium px-3 py-2">Phép</th>
              <th className="text-right font-medium px-3 py-2">Không phép</th>
              <th className="text-right font-medium px-3 py-2">Muộn</th>
              <th className="text-right font-medium px-5 py-2">Tỷ lệ</th>
            </tr></thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.cls} style={{ borderTop: `1px solid ${TOKENS.border}` }}>
                  <td className="px-5 py-2 font-medium">{r.cls}</td>
                  <td className="text-right px-3 py-2">{r.total}</td>
                  <td className="text-right px-3 py-2" style={{ color: TOKENS.present }}>{r.present}</td>
                  <td className="text-right px-3 py-2" style={{ color: TOKENS.excused }}>{r.excused}</td>
                  <td className="text-right px-3 py-2" style={{ color: TOKENS.absent }}>{r.absent}</td>
                  <td className="text-right px-3 py-2" style={{ color: TOKENS.late }}>{r.late}</td>
                  <td className="text-right px-5 py-2 font-semibold">{r.total === 0 ? "—" : `${r.rate}%`}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function StatCard({ label, value, color }) {
  return (
    <Card style={{ padding: "14px 16px" }}>
      <div className="text-2xl font-bold" style={{ color }}>{value}</div>
      <div className="text-xs mt-1" style={{ color: TOKENS.textSecondary }}>{label}</div>
    </Card>
  );
}

/* ---------------------------------------------------------------
   Tab Học sinh
--------------------------------------------------------------- */

function StudentsTab({ students, addStudents, renameStudent, removeStudent }) {
  const [subTab, setSubTab] = useState("manual");
  const [cls, setCls] = useState(ALL_CLASSES[0]);
  const [name, setName] = useState("");
  const [bulkText, setBulkText] = useState("");
  const [bulkResult, setBulkResult] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editingName, setEditingName] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  const list = students[cls] || [];

  function handleAddOne() {
    if (!name.trim()) return;
    addStudents(cls, [name]);
    setName("");
  }
  function handleBulkFromTextarea() {
    const lines = bulkText.split("\n").map((l) => l.trim()).filter(Boolean);
    if (lines.length === 0) return;
    addStudents(cls, lines);
    setBulkResult(`Đã thêm ${lines.length} học sinh vào lớp ${cls}.`);
    setBulkText("");
  }
  function handleFileUpload(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const text = String(reader.result || "");
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const byClass = {};
      let fallbackCount = 0;
      lines.forEach((line) => {
        const parts = line.split(",");
        if (parts.length >= 2) {
          const maybeClass = parts[0].trim().toUpperCase();
          const studentName = parts.slice(1).join(",").trim();
          if (ALL_CLASSES.includes(maybeClass) && studentName) {
            byClass[maybeClass] = byClass[maybeClass] || [];
            byClass[maybeClass].push(studentName);
            return;
          }
        }
        byClass[cls] = byClass[cls] || [];
        byClass[cls].push(line);
        fallbackCount++;
      });
      Object.entries(byClass).forEach(([c, names]) => addStudents(c, names));
      const total = Object.values(byClass).reduce((a, l) => a + l.length, 0);
      setBulkResult(`Đã nhập ${total} học sinh từ tệp${fallbackCount ? ` (${fallbackCount} dòng không rõ lớp được gán vào ${cls})` : ""}.`);
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  }

  return (
    <div className="flex flex-col gap-6">
      <Card>
        <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>Nguồn dữ liệu học sinh</div>
        <div className="px-5 pt-4 flex gap-2">
          {[{ id: "manual", label: "Nhập thủ công" }, { id: "bulk", label: "Nhập / tải lên hàng loạt" }].map((t) => (
            <button key={t.id} onClick={() => setSubTab(t.id)} className="rounded-md px-3 py-1.5 text-sm font-medium"
              style={{ background: subTab === t.id ? TOKENS.navy : "#fff", color: subTab === t.id ? "#fff" : TOKENS.textSecondary, border: `1px solid ${subTab === t.id ? TOKENS.navy : TOKENS.border}` }}>
              {t.label}
            </button>
          ))}
        </div>
        <div className="p-5">
          <div className="mb-4">
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Chọn lớp</div>
            <ClassPicker value={cls} onChange={setCls} />
          </div>
          {subTab === "manual" ? (
            <div className="flex gap-2 mb-2">
              <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleAddOne()}
                placeholder="Họ và tên học sinh" className="flex-1 rounded-md px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
              <PrimaryButton icon={Plus} onClick={handleAddOne}>Thêm</PrimaryButton>
            </div>
          ) : (
            <div className="flex flex-col gap-3">
              <div>
                <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Dán danh sách (mỗi dòng một học sinh) — sẽ thêm vào lớp {cls}</div>
                <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} rows={5} placeholder={"Nguyễn Văn A\nTrần Thị B\nLê Văn C"}
                  className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
                <div className="flex justify-end mt-2"><PrimaryButton icon={Plus} onClick={handleBulkFromTextarea}>Nhập danh sách</PrimaryButton></div>
              </div>
              <div className="pt-3" style={{ borderTop: `1px solid ${TOKENS.border}` }}>
                <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Hoặc tải lên tệp .csv / .txt — mỗi dòng "Lớp,Họ tên" (ví dụ 7A1,Nguyễn Văn A), hoặc chỉ tên nếu áp dụng cho lớp đã chọn ở trên</div>
                <label className="inline-flex items-center gap-2 rounded-md px-3 py-2 text-sm font-medium border cursor-pointer" style={{ borderColor: TOKENS.border }}>
                  <UploadCloud size={15} />Chọn tệp
                  <input type="file" accept=".csv,.txt" onChange={handleFileUpload} className="hidden" />
                </label>
              </div>
              {bulkResult && <div className="text-sm rounded-md px-3 py-2" style={{ background: TOKENS.presentBg, color: TOKENS.present }}>{bulkResult}</div>}
            </div>
          )}
        </div>
        <div className="px-5 pb-5">
          <div className="text-xs font-medium mb-2" style={{ color: TOKENS.textSecondary }}>Danh sách lớp {cls} ({list.length} học sinh)</div>
          {list.length === 0 ? <EmptyState text="Chưa có học sinh nào trong lớp này." /> : (
            <div className="rounded-md" style={{ border: `1px solid ${TOKENS.border}` }}>
              {list.map((s, idx) => (
                <div key={s.id} className="flex items-center gap-3 px-3 py-2 text-sm" style={{ borderTop: idx === 0 ? "none" : `1px solid ${TOKENS.border}` }}>
                  <div className="w-6 text-right" style={{ color: TOKENS.textSecondary }}>{idx + 1}</div>
                  {editingId === s.id ? (
                    <input autoFocus value={editingName} onChange={(e) => setEditingName(e.target.value)}
                      onKeyDown={(e) => { if (e.key === "Enter") { renameStudent(cls, s.id, editingName.trim() || s.name); setEditingId(null); } if (e.key === "Escape") setEditingId(null); }}
                      className="flex-1 rounded px-2 py-1 outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
                  ) : <div className="flex-1">{s.name}</div>}
                  {editingId === s.id ? (
                    <GhostButton icon={Check} onClick={() => { renameStudent(cls, s.id, editingName.trim() || s.name); setEditingId(null); }}>Xong</GhostButton>
                  ) : (
                    <GhostButton icon={Pencil} onClick={() => { setEditingId(s.id); setEditingName(s.name); }}>Sửa</GhostButton>
                  )}
                  {confirmDeleteId === s.id ? (
                    <div className="flex items-center gap-1.5">
                      <span className="text-xs" style={{ color: TOKENS.absent }}>Xoá?</span>
                      <GhostButton danger icon={Check} onClick={() => { removeStudent(cls, s.id); setConfirmDeleteId(null); }}>Có</GhostButton>
                      <GhostButton icon={X} onClick={() => setConfirmDeleteId(null)}>Không</GhostButton>
                    </div>
                  ) : <GhostButton danger icon={Trash2} onClick={() => setConfirmDeleteId(s.id)}>Xoá</GhostButton>}
                </div>
              ))}
            </div>
          )}
        </div>
      </Card>
    </div>
  );
}

function CompetitionTab({ students, grades, attendance, groups, groupCounts, setGroupCount, setStudentGroup, autoDistribute }) {
  const [cls, setCls] = useState(ALL_CLASSES[0]);
  const [selectedSubjects, setSelectedSubjects] = useState(SUBJECTS.slice(0, 3));
  const list = students[cls] || [];
  const n = groupCounts[cls] || 4;
  const clsGroups = groups[cls] || {};
  const clsGrades = grades[cls] || { assessments: [], scores: {} };
  const today = todayStr();
  const rec = attendance[`${today}_${cls}`] || {};

  function toggleSubject(subj) {
    setSelectedSubjects((prev) => prev.includes(subj) ? prev.filter((s) => s !== subj) : [...prev, subj]);
  }
  const subjectsForCalc = selectedSubjects.length ? selectedSubjects : SUBJECTS;

  const groupStats = useMemo(() => {
    const stats = Array.from({ length: n }, (_, i) => ({ group: i + 1, total: 0, present: 0, sumScore: 0, countScore: 0, tens: 0, bySubject: {} }));
    subjectsForCalc.forEach((subj) => stats.forEach((g) => (g.bySubject[subj] = { sum: 0, count: 0 })));
    list.forEach((s) => {
      const g = clsGroups[s.id] || 1;
      const stat = stats[g - 1];
      if (!stat) return;
      stat.total++;
      const st = rec[s.id] || "present";
      if (st === "present") stat.present++;
      clsGrades.assessments.forEach((a) => {
        if (!subjectsForCalc.includes(a.subject)) return;
        const raw = clsGrades.scores[a.id]?.[s.id];
        const val = Number(raw);
        if (raw === undefined || raw === "" || isNaN(val)) return;
        stat.sumScore += val; stat.countScore++;
        if (val === 10) stat.tens++;
        stat.bySubject[a.subject].sum += val;
        stat.bySubject[a.subject].count++;
      });
    });
    return stats.map((g) => ({
      ...g,
      avg: g.countScore ? round1(g.sumScore / g.countScore) : null,
      attendanceRate: g.total ? round1((g.present / g.total) * 100) : null,
      subjectAverages: Object.fromEntries(Object.entries(g.bySubject).map(([subj, v]) => [subj, v.count ? round1(v.sum / v.count) : 0])),
    }));
  }, [list, clsGroups, clsGrades, rec, n, subjectsForCalc]);

  const chartData = groupStats.map((g) => ({ name: `Tổ ${g.group}`, ...g.subjectAverages }));

  return (
    <div className="flex flex-col gap-6">
      <Card style={{ padding: "16px" }}>
        <div className="flex flex-wrap items-end gap-4">
          <div>
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Lớp</div>
            <ClassPicker value={cls} onChange={setCls} />
          </div>
          <div>
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Số tổ</div>
            <input type="number" min={2} max={8} value={n} onChange={(e) => setGroupCount(cls, Math.max(2, Math.min(8, Number(e.target.value) || 2)))}
              className="w-20 rounded-md px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
          </div>
          <GhostButton icon={Shuffle} onClick={() => autoDistribute(cls, n)}>Chia tổ tự động</GhostButton>
        </div>
        <div className="mt-4">
          <div className="text-xs font-medium mb-2" style={{ color: TOKENS.textSecondary }}>So sánh theo môn (chọn 1 hoặc nhiều môn)</div>
          <div className="flex flex-wrap gap-2">
            {SUBJECTS.map((subj) => (
              <button key={subj} onClick={() => toggleSubject(subj)} className="rounded-full px-3 py-1 text-xs font-medium border"
                style={{ background: selectedSubjects.includes(subj) ? "#EAF0F7" : "#fff", color: selectedSubjects.includes(subj) ? TOKENS.navy : TOKENS.textSecondary, borderColor: selectedSubjects.includes(subj) ? TOKENS.navy : TOKENS.border }}>
                {subj}
              </button>
            ))}
          </div>
        </div>
      </Card>
      {list.length === 0 ? (
        <Card><EmptyState text={`Lớp ${cls} chưa có danh sách học sinh. Vào mục "Học sinh" để thêm.`} /></Card>
      ) : (
        <>
          <Card style={{ padding: "20px" }}>
            <div className="text-sm font-semibold mb-4">So sánh điểm trung bình giữa các tổ</div>
            <SimpleBarChart
              data={chartData}
              series={subjectsForCalc.map((subj, i) => ({ key: subj, color: SUBJECT_COLORS[i % SUBJECT_COLORS.length], label: subj }))}
              height={280}
            />
          </Card>
          <Card>
            <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>Tổng kết theo tổ</div>
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 p-5">
              {groupStats.map((g) => (
                <Card key={g.group} style={{ padding: "14px" }}>
                  <div className="text-sm font-bold mb-2">Tổ {g.group}</div>
                  <div className="text-xs flex flex-col gap-1" style={{ color: TOKENS.textSecondary }}>
                    <div>Sĩ số: <b style={{ color: TOKENS.textPrimary }}>{g.total}</b></div>
                    <div>ĐTB: <b style={{ color: TOKENS.textPrimary }}>{g.avg ?? "—"}</b></div>
                    <div>Chuyên cần: <b style={{ color: TOKENS.textPrimary }}>{g.attendanceRate ?? "—"}{g.attendanceRate !== null ? "%" : ""}</b></div>
                    <div>Điểm 10: <b style={{ color: TOKENS.gold }}>★ {g.tens}</b></div>
                  </div>
                </Card>
              ))}
            </div>
          </Card>
          <Card>
            <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>Gán học sinh vào tổ</div>
            <div>
              {list.map((s, idx) => (
                <div key={s.id} className="flex items-center gap-3 px-5 py-2 text-sm" style={{ borderTop: idx === 0 ? "none" : `1px solid ${TOKENS.border}` }}>
                  <div className="w-6 text-right" style={{ color: TOKENS.textSecondary }}>{idx + 1}</div>
                  <div className="flex-1">{s.name}</div>
                  <div className="relative">
                    <select value={clsGroups[s.id] || 1} onChange={(e) => setStudentGroup(cls, s.id, Number(e.target.value))}
                      className="appearance-none rounded-md pl-3 pr-7 py-1.5 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }}>
                      {Array.from({ length: n }, (_, i) => i + 1).map((g) => <option key={g} value={g}>Tổ {g}</option>)}
                    </select>
                    <ChevronDown size={13} className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none" style={{ color: TOKENS.textSecondary }} />
                  </div>
                </div>
              ))}
            </div>
          </Card>
        </>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------
   Tab AI Nhận xét
--------------------------------------------------------------- */

function AiCommentsTab({ students, attendance, grades, comments, generateClassComments, generateOneComment, setCommentText }) {
  const [cls, setCls] = useState(ALL_CLASSES[0]);
  const [batchLoading, setBatchLoading] = useState(false);
  const [batchMsg, setBatchMsg] = useState("");
  const [rowLoading, setRowLoading] = useState({});
  const list = students[cls] || [];
  const clsComments = comments[cls] || {};

  async function handleBatch() {
    setBatchLoading(true); setBatchMsg("");
    const res = await generateClassComments(cls);
    setBatchLoading(false);
    setBatchMsg(res.ok ? `Đã tạo nhận xét cho ${list.length} học sinh.` : res.msg || "Có lỗi xảy ra, vui lòng thử lại.");
    setTimeout(() => setBatchMsg(""), 5000);
  }
  async function handleOne(studentId) {
    setRowLoading((p) => ({ ...p, [studentId]: true }));
    await generateOneComment(cls, studentId);
    setRowLoading((p) => ({ ...p, [studentId]: false }));
  }

  return (
    <div className="flex flex-col gap-6">
      <Card style={{ padding: "16px" }}>
        <div className="flex flex-wrap items-end gap-4">
          <div>
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Lớp</div>
            <ClassPicker value={cls} onChange={setCls} />
          </div>
          <div className="flex-1" />
          <PrimaryButton icon={batchLoading ? RefreshCw : Sparkles} disabled={batchLoading || list.length === 0} onClick={handleBatch}>
            {batchLoading ? "Đang tạo nhận xét…" : "Tạo nhận xét cho cả lớp bằng AI"}
          </PrimaryButton>
        </div>
        {batchMsg && <div className="text-sm rounded-md px-3 py-2 mt-3" style={{ background: TOKENS.presentBg, color: TOKENS.present }}>{batchMsg}</div>}
        <div className="flex items-start gap-2 text-xs rounded-md px-3 py-2 mt-3" style={{ background: TOKENS.excusedBg, color: TOKENS.excused }}>
          <AlertTriangle size={14} className="mt-0.5 shrink-0" />
          <span>Cần nhập Anthropic API Key ở mục Cài đặt để dùng tính năng này. Nhận xét do AI tạo — giáo viên nên đọc và chỉnh sửa lại trước khi dùng chính thức.</span>
        </div>
      </Card>
      <Card>
        {list.length === 0 ? <EmptyState text={`Lớp ${cls} chưa có danh sách học sinh. Vào mục "Học sinh" để thêm.`} /> : (
          <div>
            {list.map((s, idx) => {
              const c = clsComments[s.id];
              const sum = summarizeStudent(cls, s.id, attendance, grades);
              return (
                <div key={s.id} className="px-5 py-4" style={{ borderTop: idx === 0 ? "none" : `1px solid ${TOKENS.border}` }}>
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div className="text-sm font-semibold">{idx + 1}. {s.name}</div>
                    <div className="flex items-center gap-2">
                      <span className="text-xs" style={{ color: TOKENS.textSecondary }}>ĐTB: {sum.overallAvg ?? "—"} · Chuyên cần: {sum.totalDays ? `${sum.present}/${sum.totalDays}` : "—"}</span>
                      <GhostButton icon={rowLoading[s.id] ? RefreshCw : Sparkles} onClick={() => handleOne(s.id)}>{rowLoading[s.id] ? "Đang tạo…" : "Tạo lại bằng AI"}</GhostButton>
                    </div>
                  </div>
                  <textarea value={c?.text || ""} onChange={(e) => setCommentText(cls, s.id, e.target.value)}
                    placeholder="Chưa có nhận xét — bấm “Tạo lại bằng AI” hoặc tự nhập tại đây." rows={2}
                    className="w-full rounded-md px-3 py-2 text-sm outline-none" style={{ border: `1px solid ${TOKENS.border}` }} />
                  {c?.updatedAt && <div className="text-[11px] mt-1" style={{ color: TOKENS.textSecondary }}>Cập nhật lúc {formatTime(c.updatedAt)}</div>}
                </div>
              );
            })}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------
   Tab Cài đặt
--------------------------------------------------------------- */

function SettingsTab({
  googleClientId, saveGoogleClientId, anthropicKey, saveAnthropicKey,
  driveConnected, onConnectDrive, autoSync, setAutoSync, syncStatus, lastSync, onSyncNow, onPullNow,
}) {
  const [clientIdDraft, setClientIdDraft] = useState(googleClientId);
  const [keyDraft, setKeyDraft] = useState(anthropicKey);
  const [connectMsg, setConnectMsg] = useState("");
  const [connecting, setConnecting] = useState(false);
  const [pullConfirming, setPullConfirming] = useState(false);
  const [pullMsg, setPullMsg] = useState("");

  async function handleConnect() {
    saveGoogleClientId(clientIdDraft.trim());
    setConnecting(true);
    const res = await onConnectDrive();
    setConnecting(false);
    setConnectMsg(res.ok ? "Đã kết nối Google Drive thành công." : res.msg || "Kết nối thất bại.");
    setTimeout(() => setConnectMsg(""), 5000);
  }

  return (
    <div className="flex flex-col gap-6">
      <Card>
        <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>1. Kết nối Google Drive (bắt buộc để đồng bộ)</div>
        <div className="p-5 flex flex-col gap-4">
          <div>
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>Google OAuth Client ID</div>
            <input value={clientIdDraft} onChange={(e) => setClientIdDraft(e.target.value)}
              placeholder="xxxxxxxxxxxx.apps.googleusercontent.com"
              className="w-full rounded-md px-3 py-2 text-sm outline-none font-mono" style={{ border: `1px solid ${TOKENS.border}` }} />
            <div className="text-xs mt-1" style={{ color: TOKENS.textSecondary }}>
              Lấy tại Google Cloud Console — xem hướng dẫn trong README đi kèm. Chỉ lưu trên trình duyệt của bạn, không gửi đi đâu khác.
            </div>
          </div>
          <div className="flex items-center gap-3 flex-wrap">
            <PrimaryButton icon={connecting ? RefreshCw : LogIn} disabled={connecting || !clientIdDraft.trim()} onClick={handleConnect}>
              {connecting ? "Đang kết nối…" : driveConnected ? "Đăng nhập lại Google Drive" : "Kết nối Google Drive"}
            </PrimaryButton>
            <SyncBadge status={driveConnected ? syncStatus : "offline"} lastSync={lastSync} />
          </div>
          {connectMsg && <div className="text-sm rounded-md px-3 py-2" style={{ background: TOKENS.presentBg, color: TOKENS.present }}>{connectMsg}</div>}

          {driveConnected && (
            <div className="flex items-center gap-2 flex-wrap pt-2" style={{ borderTop: `1px solid ${TOKENS.border}` }}>
              <GhostButton icon={UploadCloud} onClick={onSyncNow}>Đồng bộ ngay</GhostButton>
              {pullConfirming ? (
                <div className="flex items-center gap-1.5">
                  <span className="text-xs" style={{ color: TOKENS.absent }}>Ghi đè dữ liệu hiện tại?</span>
                  <GhostButton danger icon={Check} onClick={async () => {
                    setPullConfirming(false);
                    const res = await onPullNow();
                    setPullMsg(res.ok ? "Đã tải dữ liệu mới nhất từ Drive." : res.msg || "Không tải được từ Drive.");
                    setTimeout(() => setPullMsg(""), 4000);
                  }}>Có</GhostButton>
                  <GhostButton icon={X} onClick={() => setPullConfirming(false)}>Không</GhostButton>
                </div>
              ) : <GhostButton icon={DownloadCloud} onClick={() => setPullConfirming(true)}>Tải từ Drive</GhostButton>}
              <label className="flex items-center gap-2 text-sm cursor-pointer select-none ml-2">
                <input type="checkbox" checked={autoSync} onChange={(e) => setAutoSync(e.target.checked)} />
                Tự động đồng bộ khi có thay đổi
              </label>
            </div>
          )}
          {pullMsg && <div className="text-sm rounded-md px-3 py-2" style={{ background: TOKENS.excusedBg, color: TOKENS.excused }}>{pullMsg}</div>}

          <div className="flex items-start gap-2 text-xs rounded-md px-3 py-2" style={{ background: TOKENS.lateBg, color: "#8a6417" }}>
            <AlertTriangle size={14} className="mt-0.5 shrink-0" />
            <span>
              Dữ liệu luôn lưu ngay trên trình duyệt trước. Đồng bộ Drive là thật (Google Drive API), file tên <code>{DRIVE_FILE_NAME}</code>.
              App tự kiểm tra Drive mỗi ~45 giây khi đã kết nối — đây là đồng bộ theo chu kỳ, không phải đẩy tức thời từng phím gõ.
            </span>
          </div>
        </div>
      </Card>

      <Card>
        <div className="px-5 py-4 text-sm font-semibold" style={{ borderBottom: `1px solid ${TOKENS.border}` }}>2. Anthropic API Key (chỉ cần cho mục "AI Nhận xét")</div>
        <div className="p-5 flex flex-col gap-3">
          <div>
            <div className="text-xs font-medium mb-1" style={{ color: TOKENS.textSecondary }}>API Key</div>
            <input type="password" value={keyDraft} onChange={(e) => setKeyDraft(e.target.value)} placeholder="sk-ant-..."
              className="w-full rounded-md px-3 py-2 text-sm outline-none font-mono" style={{ border: `1px solid ${TOKENS.border}` }} />
          </div>
          <div className="flex items-center gap-3">
            <PrimaryButton icon={KeyRound} onClick={() => saveAnthropicKey(keyDraft.trim())}>Lưu API Key</PrimaryButton>
            {anthropicKey && <span className="text-xs" style={{ color: TOKENS.present }}>Đã lưu key trong trình duyệt này.</span>}
          </div>
          <div className="flex items-start gap-2 text-xs rounded-md px-3 py-2" style={{ background: TOKENS.excusedBg, color: TOKENS.excused }}>
            <AlertTriangle size={14} className="mt-0.5 shrink-0" />
            <span>
              Key chỉ lưu trong trình duyệt của bạn (localStorage) và chỉ dùng để gọi thẳng tới Anthropic — không qua máy chủ nào khác.
              Không dùng chung máy tính công cộng khi đã lưu key, và không chia sẻ máy đã đăng nhập cho người lạ.
            </span>
          </div>
        </div>
      </Card>

      <Card style={{ padding: "16px" }}>
        <div className="text-sm font-semibold mb-2">Thông tin lớp học</div>
        <div className="text-sm" style={{ color: TOKENS.textSecondary }}>
          {SCHOOL_NAME} · Cấp THCS · 15 lớp · Khối 7: 7A1–7A7 · Khối 8: 8A1–8A8 · Năm học {academicYear()}
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------
   Khởi chạy
--------------------------------------------------------------- */

ReactDOM.createRoot(document.getElementById("app")).render(<AttendanceApp />);
</script>
